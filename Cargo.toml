[workspace]
resolver = "2"
members = ["crates/cleanbro-core", "apps/linux/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
cleanbro-core = { path = "crates/cleanbro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2" }
tauri-build = { version = "2" }
jwalk = "0.9"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
sysinfo = "0.40"
globset = "0.4"
uuid = { version = "1", features = ["v4"] }
trash = "5"
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
